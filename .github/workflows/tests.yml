name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: cli smoke test
        # A 404 must score 0 and exit non-zero; this exercises the whole path
        # without depending on any x402 seller staying online.
        run: |
          python -m x402_readiness.cli --json https://httpbin.org/status/404 > out.json || true
          python -c "import json;d=json.load(open('out.json'));assert d['score']==0,d;assert d['verdict']=='unreachable' or d['verdict']=='broken',d"
